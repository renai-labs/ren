id: require-native-button
language: Tsx
message: "When `render` turns a trigger into a non-button element, add `nativeButton={false}` so Base UI gives it button semantics."
severity: error
files:
  - packages/ui/src/**
  - packages/app/src/**
rule:
  any:
    - kind: jsx_opening_element
    - kind: jsx_self_closing_element
  all:
    - has:
        field: name
        regex: ^[A-Z]\w*(Trigger|Close)$
    - not:
        has:
          field: name
          regex: ^(Tooltip|HoverCard)Trigger$
    - has:
        kind: jsx_attribute
        all:
          - has:
              kind: property_identifier
              regex: ^render$
          - has:
              kind: jsx_expression
              has:
                any:
                  - kind: jsx_self_closing_element
                  - kind: jsx_element
                has:
                  stopBy: end
                  field: name
                  regex: ^(span|div|InputGroupAddon)$
    - not:
        has:
          kind: jsx_attribute
          has:
            kind: property_identifier
            regex: ^nativeButton$
