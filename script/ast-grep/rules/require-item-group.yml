id: require-item-group
language: Tsx
message: Put `SelectItem`, `DropdownMenuItem` and `CommandItem` inside their group (`SelectGroup`, `DropdownMenuGroup`, `CommandGroup`), as shadcn composes them.
severity: error
files:
  - packages/ui/src/**
  - packages/app/src/**
rule:
  any:
    - kind: jsx_opening_element
    - kind: jsx_self_closing_element
  has:
    field: name
    regex: ^(Select|DropdownMenu|Command)Item$
  not:
    inside:
      stopBy: end
      kind: jsx_element
      has:
        field: open_tag
        has:
          field: name
          regex: ^(Select|DropdownMenu|Command)Group$
