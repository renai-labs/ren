id: no-gated-scroller-button
language: Tsx
message: "`MessageScrollerButton` shows and hides itself from the scroll position. Render it unconditionally."
severity: error
files:
  - packages/ui/src/**
  - packages/app/src/**
rule:
  any:
    - kind: jsx_self_closing_element
    - kind: jsx_opening_element
  has:
    field: name
    regex: ^MessageScrollerButton$
  inside:
    stopBy:
      kind: jsx_element
    any:
      - kind: binary_expression
      - kind: ternary_expression
