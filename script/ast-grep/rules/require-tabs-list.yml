id: require-tabs-list
language: Tsx
message: Put every `TabsTrigger` inside a `TabsList`. The list gives the triggers their `tablist` role and keyboard navigation.
severity: error
files:
  - packages/ui/src/**
  - packages/app/src/**
rule:
  any:
    - kind: jsx_opening_element
    - kind: jsx_self_closing_element
  has:
    field: name
    regex: ^TabsTrigger$
  not:
    inside:
      stopBy: end
      kind: jsx_element
      has:
        field: open_tag
        has:
          field: name
          regex: ^TabsList$
