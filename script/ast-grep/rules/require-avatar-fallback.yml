id: require-avatar-fallback
language: Tsx
message: Give every `Avatar` an `AvatarFallback`, shown while the image loads and when it fails.
severity: error
files:
  - packages/ui/src/**
  - packages/app/src/**
rule:
  any:
    - kind: jsx_self_closing_element
      has:
        field: name
        regex: ^Avatar$
    - kind: jsx_element
      has:
        field: open_tag
        has:
          field: name
          regex: ^Avatar$
      not:
        has:
          stopBy: end
          kind: identifier
          regex: ^AvatarFallback$
