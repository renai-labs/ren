id: require-loader-start
language: Tsx
message: >-
  Every query an app route's loader fetches goes through `Loader.start(...)` from lib/loader.ts, which starts it without awaiting it. Read it in the component with `useQuery` and draw the skeleton while it is pending; awaiting it holds the navigation on the previous page. A loader that must read the data first, to redirect or to act on it, awaits it and says why in an ast-grep-ignore.
severity: error
files:
  - packages/app/src/routes/_authed/**
rule:
  kind: call_expression
  has:
    field: function
    kind: member_expression
    has:
      field: property
      regex: ^(query|infiniteQuery|fetchQuery|ensureQueryData|prefetchQuery|prefetchInfiniteQuery)$
  inside:
    any:
      - kind: pair
        has:
          field: key
          regex: ^loader$
      - kind: method_definition
        has:
          field: name
          regex: ^loader$
    stopBy: end
  not:
    inside:
      kind: call_expression
      pattern: Loader.start($$$)
      stopBy: end
