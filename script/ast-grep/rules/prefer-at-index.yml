id: prefer-at-index
language: Tsx
message: "Read array elements with `.at(index)` instead of a numeric subscript."
severity: error
files:
  - packages/*/src/**/*.ts
  - packages/*/src/**/*.tsx
ignores:
  - packages/httpapi-codegen/**
  - packages/app/**
rule:
  kind: subscript_expression
  has:
    field: index
    kind: number
