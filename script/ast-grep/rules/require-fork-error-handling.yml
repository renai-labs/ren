id: require-fork-error-handling
language: Tsx
message: A forked fiber that fails leaves no trace. Report its failures with Effect.withErrorReporting, or handle its cause with Effect.catchCause, Effect.onError or Effect.onExit, in the effect that it runs (before the fork in a pipe, or inside the call of FiberHandle.run, FiberMap.run, FiberSet.run or runFork).
severity: error
files:
  - packages/core/src/**
  - packages/server/src/**
  - packages/cell/src/**
  - packages/brain/src/**
  - packages/executor/src/**
rule:
  any:
    - all:
        - any:
            - pattern: Effect.fork
            - pattern: Effect.forkChild
            - pattern: Effect.forkChild($$$)
            - pattern: Effect.forkScoped
            - pattern: Effect.forkScoped($$$)
            - pattern: Effect.forkDaemon
            - pattern: Effect.forkDaemon($$$)
            - pattern: Effect.forkIn($$$)
            - pattern: FiberHandle.run($HANDLE)
            - pattern: FiberMap.run($MAP, $KEY)
            - pattern: FiberSet.run($SET)
        - inside:
            kind: arguments
            inside:
              pattern: $SELF.pipe($$$)
        - not:
            follows:
              stopBy: end
              any:
                - pattern: Effect.withErrorReporting
                - pattern: Effect.catchCause($$$)
                - pattern: Effect.onError($$$)
                - pattern: Effect.onExit($$$)
    - all:
        - pattern: Effect.forkIn($EFFECT, $SCOPE)
        - not:
            inside:
              kind: arguments
              inside:
                pattern: $SELF.pipe($$$)
    - all:
        - any:
            - pattern: FiberHandle.run($HANDLE, $EFFECT)
            - pattern: FiberHandle.run($HANDLE, $EFFECT, $$$)
            - pattern: FiberMap.run($MAP, $KEY, $EFFECT)
            - pattern: FiberMap.run($MAP, $KEY, $EFFECT, $$$)
            - pattern: FiberSet.run($SET, $EFFECT)
            - pattern: FiberSet.run($SET, $EFFECT, $$$)
            - pattern: Effect.runFork($$$)
            - pattern: $RUNTIME.runFork($$$)
        - not:
            has:
              stopBy: end
              any:
                - pattern: Effect.withErrorReporting
                - pattern: Effect.catchCause($$$)
                - pattern: Effect.onError($$$)
                - pattern: Effect.onExit($$$)
