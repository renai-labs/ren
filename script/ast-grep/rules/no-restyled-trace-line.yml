id: no-restyled-trace-line
language: Tsx
message: "Keep `TraceLine` a line: wrap it in a trigger instead of rendering a trigger as it, and show state with `status`, not `opacity-*`."
severity: error
files:
  - packages/ui/src/**
  - packages/app/src/**
rule:
  kind: jsx_attribute
  any:
    - all:
        - has:
            kind: property_identifier
            regex: ^render$
        - has:
            stopBy: end
            kind: identifier
            regex: ^TraceLine$
    - all:
        - has:
            kind: property_identifier
            regex: ^className$
        - has:
            stopBy: end
            kind: string_fragment
            regex: (^|\s)opacity-
        - inside:
            any:
              - kind: jsx_opening_element
              - kind: jsx_self_closing_element
            has:
              field: name
              regex: ^TraceLine$
