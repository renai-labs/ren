<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ren</title>
    <meta name="color-scheme" content="light dark" />
    <style>
      html {
        background: #f9f9f9;
      }
      html.dark {
        background: #151515;
      }
    </style>
    <script>
      try {
        const theme = JSON.parse(localStorage.getItem("ren.ui") ?? "{}").state?.theme ?? "dark"
        const dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.toggle("dark", dark)
        document.documentElement.style.colorScheme = dark ? "dark" : "light"
      } catch {}
    </script>
    <link rel="preload" href="/src/assets/fonts/sf-pro.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
