<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="frame-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ren</title>
    <meta name="color-scheme" content="light dark" />
    <style>
      html {
        background: #f9f9f9;
      }
      html.dark {
        background: #151515;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgb(27 27 27 / 0.1);
      }
      html.dark #boot {
        color: rgb(241 241 241 / 0.1);
      }
      #boot svg {
        height: 2.25rem;
      }
      #boot .bar {
        color: #5d5d5d;
        animation: boot-progress 2.4s ease-out forwards;
      }
      html.dark #boot .bar {
        color: #a3a3a3;
      }
      body:has(#root > :not(section, output)) #boot {
        display: none;
      }
      @keyframes boot-progress {
        from {
          clip-path: inset(0 100% 0 0);
        }
        to {
          clip-path: inset(0 15% 0 0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .bar {
          animation: none;
        }
      }
    </style>
    <script>
      try {
        const stored = JSON.parse(localStorage.getItem("ren.theme.v1") ?? '"dark"')
        const dark = stored === "dark" || (stored === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.toggle("dark", dark)
        document.documentElement.style.colorScheme = dark ? "dark" : "light"
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" role="status" aria-label="Loading Ren…">
      <svg viewBox="0 0 876 1003" fill="currentColor" aria-hidden="true">

          d="M674.769 14.6123H596.325C544.865 14.6123 503.149 56.3285 503.149 107.788V691.749C503.149 743.208 544.865 784.925 596.325 784.925H674.769C726.228 784.925 767.944 743.208 767.944 691.749V107.788C767.944 56.3285 726.228 14.6123 674.769 14.6123Z"
        />
        <path
          d="M211.519 66.6589C226.177 17.3317 278.048 -10.7739 327.375 3.88454L402.569 26.229C451.897 40.8874 480.001 92.7583 465.343 142.086L299.002 701.859C284.344 751.186 232.473 779.288 183.146 764.631L107.952 742.288C58.6238 727.622 30.5192 675.756 45.1767 626.428L211.519 66.6589Z"
        />
        <path
          d="M0 965.005C0 944.423 16.6868 927.735 37.2703 927.735H838.581C859.164 927.735 875.851 944.423 875.851 965.005C875.851 985.588 859.164 1002.28 838.581 1002.28H37.2703C16.6868 1002.28 0 985.588 0 965.005Z"
        />
        <path
          class="bar"
          d="M0 965.005C0 944.423 16.6868 927.735 37.2703 927.735H838.581C859.164 927.735 875.851 944.423 875.851 965.005C875.851 985.588 859.164 1002.28 838.581 1002.28H37.2703C16.6868 1002.28 0 985.588 0 965.005Z"
        />
      </svg>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
