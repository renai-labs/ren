<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{title}}</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: #151515;
        color: #f1f1f1;
        font-family: "SF Pro Variable", ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 400px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 32px;
        background: #1f1f1f;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        text-align: center;
      }
      main[data-status="ok"] .error,
      main[data-status="error"] .ok,
      main[data-app="none"] .mark {
        display: none;
      }
      .mark {
        position: relative;
        width: 56px;
        height: 56px;
      }
      .logo {
        width: 48px;
        height: 48px;
        border-radius: 8px;
        object-fit: cover;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.08);
        font-size: 20px;
        font-weight: 510;
      }
      .badge {
        position: absolute;
        left: 32px;
        top: 32px;
        width: 24px;
        height: 24px;
        border-radius: 9999px;
        background: #1f1f1f;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .heading {
        display: flex;
        flex-direction: column;
        gap: 6px;
        overflow-wrap: anywhere;
      }
      h1 {
        font-size: 20px;
        line-height: 28px;
        font-weight: 510;
      }
      p {
        font-size: 14px;
        line-height: 20px;
        color: #a3a3a3;
      }
      small {
        font-size: 12px;
        line-height: 16px;
        color: #a3a3a3;
      }
      button {
        height: 32px;
        padding: 0 12px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        background: transparent;
        color: #a3a3a3;
        font: inherit;
        font-size: 14px;
        font-weight: 510;
        cursor: pointer;
      }
      button:hover {
        background: rgba(255, 255, 255, 0.04);
        color: #f1f1f1;
      }
      button:focus-visible {
        outline: 3px solid rgba(163, 163, 163, 0.5);
      }
    </style>
  </head>
  <body>
    <main data-status="{{status}}" data-app="{{app}}">
      <div class="mark">
        {{logo}}
        <span class="badge">
          <svg class="ok" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">

              clip-rule="evenodd"

              d="M18 10C18 12.1217 17.1571 14.1566 15.6568 15.6569C14.1565 17.1571 12.1217 18 9.99997 18C7.87824 18 5.84341 17.1571 4.34312 15.6569C2.84282 14.1566 1.99997 12.1217 1.99997 10C1.99997 7.87827 2.84282 5.84343 4.34312 4.34314C5.84341 2.84285 7.87824 2 9.99997 2C12.1217 2 14.1565 2.84285 15.6568 4.34314C17.1571 5.84343 18 7.87827 18 10ZM9.99997 5C10.1989 5 10.3896 5.07902 10.5303 5.21967C10.671 5.36032 10.75 5.55109 10.75 5.75V10.25C10.75 10.4489 10.671 10.6397 10.5303 10.7803C10.3896 10.921 10.1989 11 9.99997 11C9.80106 11 9.61029 10.921 9.46964 10.7803C9.32899 10.6397 9.24997 10.4489 9.24997 10.25V5.75C9.24997 5.55109 9.32899 5.36032 9.46964 5.21967C9.61029 5.07902 9.80106 5 9.99997 5ZM9.99997 15C10.2652 15 10.5195 14.8946 10.7071 14.7071C10.8946 14.5196 11 14.2652 11 14C11 13.7348 10.8946 13.4804 10.7071 13.2929C10.5195 13.1054 10.2652 13 9.99997 13C9.73475 13 9.4804 13.1054 9.29286 13.2929C9.10533 13.4804 8.99997 13.7348 8.99997 14C8.99997 14.2652 9.10533 14.5196 9.29286 14.7071C9.4804 14.8946 9.73475 15 9.99997 15Z"
            />
          </svg>
        </span>
      </div>
      <div class="heading">
        <h1>{{title}}</h1>
        <p>{{message}}</p>
      </div>
      <small class="ok" id="footer">This tab closes in 2 s.</small>
      <button class="error" type="button" onclick="window.close()">Close tab</button>
    </main>
    <script>
      if (document.querySelector("main").dataset.status === "ok")
        setTimeout(() => {
          window.close()
          document.getElementById("footer").textContent = "You can close this tab."
        }, 2000)
    </script>
  </body>
</html>
