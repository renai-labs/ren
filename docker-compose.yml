name: ren

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ren
      POSTGRES_PASSWORD: ren
      POSTGRES_DB: ren
    ports:
      - "54320:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ren"]
      interval: 2s
      timeout: 5s
      retries: 20

  celld:
    build: packages/cell/docker
    image: ren-celld
    command: ["dev", "/repo/packages/cell", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:9876:9876"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/repo
      - celld:/repo/packages/cell/.celld

  # The egress proxy (iron-proxy fork). Make its certificates first, then
  # `docker compose --profile egress up -d`:
  # bun run --cwd repos/iron-proxy certificates
  egress:
    profiles: ["egress"]
    build: repos/iron-proxy
    image: ren-egress
    command: ["--config", "/etc/ren-egress/dev.yaml"]
    ports:
      - "127.0.0.1:1080:1080"
      - "127.0.0.1:9443:9443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./repos/iron-proxy/dev.yaml:/etc/ren-egress/dev.yaml:ro
      - ./repos/iron-proxy/.dev/certs:/certs:ro
    stop_grace_period: 15m

volumes:
  postgres:
  celld:
