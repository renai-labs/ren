name: ren

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ren
      POSTGRES_PASSWORD: ren
      POSTGRES_DB: ren
    ports:
      - "54320:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ren"]
      interval: 2s
      timeout: 5s
      retries: 20

  # S3 for drives, with STS. `rustfs-setup` makes the dev and test buckets and lets the app post uploads.
  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: rendev
      RUSTFS_SECRET_KEY: ren-dev-secret
    ports:
      - "127.0.0.1:59000:9000"
    volumes:
      - rustfs:/data

  rustfs-setup:
    image: amazon/aws-cli:latest
    depends_on:
      - rustfs
    environment:
      AWS_ACCESS_KEY_ID: rendev
      AWS_SECRET_ACCESS_KEY: ren-dev-secret
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://rustfs:9000
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until aws s3api list-buckets >/dev/null 2>&1; do sleep 1; done;
        for bucket in ren-drives ren-drives-test; do
        aws s3api create-bucket --bucket $$bucket >/dev/null 2>&1;
        aws s3api put-bucket-cors --bucket $$bucket --cors-configuration
        '{"CORSRules":[{"AllowedOrigins":["http://localhost:5173"],"AllowedMethods":["GET","POST"],"AllowedHeaders":["*"]}]}';
        done

  celld:
    build: packages/cell/docker
    image: ren-celld
    command: ["dev", "/repo/packages/cell", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:9876:9876"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/repo
      - celld:/repo/packages/cell/.celld

  # The egress proxy (iron-proxy fork). Make its certificates first, then
  # `docker compose --profile egress up -d`:
  # bun run --cwd repos/iron-proxy certificates
  egress:
    profiles: ["egress"]
    build: repos/iron-proxy
    image: ren-egress
    command: ["--config", "/etc/ren-egress/dev.yaml"]
    ports:
      - "127.0.0.1:1080:1080"
      - "127.0.0.1:9443:9443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./repos/iron-proxy/dev.yaml:/etc/ren-egress/dev.yaml:ro
      - ./repos/iron-proxy/.dev/certs:/certs:ro
    stop_grace_period: 15m

volumes:
  postgres:
  rustfs:
  celld:
