name: deploy

# Deploys main to the deployment in the `v2-prod` GitHub environment. Every value that names the
# account lives in that environment: the role as a secret, the rest as variables. Infrastructure
# (infra/aws) is applied by hand, never here.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-v2-prod
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  changes:
    name: changes
    if: github.repository == 'renai-labs/ren'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      server: ${{ steps.diff.outputs.server }}
      app: ${{ steps.diff.outputs.app }}
      site: ${{ steps.diff.outputs.site }}
      egress: ${{ steps.diff.outputs.egress }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # The base is the last successful deploy, so a failed or cancelled run never drops a change.
      # The brain template decides for itself (cell/e2b/stage.ts).
      - name: Find changed parts
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          if [ "$EVENT" != "push" ] || [ -z "$base" ] || ! git merge-base --is-ancestor "$base" "$GITHUB_SHA" \
            || ! git diff --quiet "$base" "$GITHUB_SHA" -- .github/workflows/deploy.yml; then
            printf '%s=true\n' server app site egress >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Last successful deploy: $base"
          for part in server app site; do
            affected=$(bun turbo query affected --packages "@ren/$part" --base "$base" --head "$GITHUB_SHA" | jq '.data.affectedPackages.length > 0')
            echo "$part=$affected" | tee -a "$GITHUB_OUTPUT"
          done
          if git diff --quiet "$base" "$GITHUB_SHA" -- repos/iron-proxy; then
            echo "egress=false" | tee -a "$GITHUB_OUTPUT"
          else
            echo "egress=true" | tee -a "$GITHUB_OUTPUT"
          fi

  template:
    name: brain template
    needs: changes
    runs-on: ubuntu-latest
    environment: v2-prod
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.build.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      # Builds only when no template with this hash exists, and then prints the existing tag.
      - name: Build the brain template
        id: build
        env:
          DEPLOY: ${{ vars.DEPLOY_NAME }}
          E2B_TEMPLATE_NAME: ${{ vars.E2B_TEMPLATE_NAME }}
          E2B_TEMPLATE_OWNER: ${{ vars.E2B_OWNER }}
          E2B_TEMPLATE_CPU: "8"
          E2B_TEMPLATE_MEMORY_MB: "8192"
          E2B_TEMPLATE_TOOLS: full
        run: |
          set -euo pipefail
          E2B_API_KEY=$(aws secretsmanager get-secret-value --secret-id "$DEPLOY/deploy" --query SecretString --output text | jq -r .E2B_API_KEY)
          echo "::add-mask::$E2B_API_KEY"
          export E2B_API_KEY
          bun run --cwd packages/cell template:e2b | tee template.log
          tag=$(sed -n -e 's/^E2B_TEMPLATE=\([^ ]*\).*/\1/p' -e 's/^\([^ ]*:[0-9a-f]*\) exists.*/\1/p' template.log | tail -1)
          test -n "$tag"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

  server:
    name: server
    needs: [changes, template]
    runs-on: ubuntu-latest
    environment: v2-prod
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      # The service runs one revision; the newest revision of the family carries what infra/aws last
      # set. A newer one than the service runs means new settings to roll out.
      - name: Read the running revision
        id: current
        env:
          DEPLOY: ${{ vars.DEPLOY_NAME }}
        run: |
          set -euo pipefail
          running=$(aws ecs describe-services --cluster "$DEPLOY" --services server --query 'services[0].taskDefinition' --output text)
          aws ecs describe-task-definition --task-definition "$running" --query taskDefinition >running.json
          aws ecs describe-task-definition --task-definition "$DEPLOY-server" --query taskDefinition >current.json
          {
            echo "image=$(jq -r '.containerDefinitions[0].image' running.json)"
            echo "template=$(jq -r '[.containerDefinitions[0].environment[] | select(.name == "E2B_TEMPLATE") | .value][0] // ""' running.json)"
            echo "settings=$(jq -r '.taskDefinitionArn != $running' --arg running "$running" current.json)"
          } >>"$GITHUB_OUTPUT"

      - name: Build and push the image
        id: image
        if: needs.changes.outputs.server == 'true'
        env:
          DEPLOY: ${{ vars.DEPLOY_NAME }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          registry="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.$REGION.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          image="$registry/$DEPLOY-server:$GITHUB_SHA"
          docker build --platform linux/amd64 -f packages/server/Dockerfile -t "$image" .
          docker push "$image"
          echo "image=$image" >>"$GITHUB_OUTPUT"

      # Only the image and the template change here.
      - name: Roll out
        if: steps.image.outputs.image != '' || steps.current.outputs.template != needs.template.outputs.tag || steps.current.outputs.settings == 'true'
        env:
          DEPLOY: ${{ vars.DEPLOY_NAME }}
          IMAGE: ${{ steps.image.outputs.image || steps.current.outputs.image }}
          TEMPLATE: ${{ needs.template.outputs.tag }}
        run: |
          set -euo pipefail
          jq --arg image "$IMAGE" --arg template "$TEMPLATE" '
            .containerDefinitions[0].image = $image
            | .containerDefinitions[0].environment = ([.containerDefinitions[0].environment[] | select(.name != "E2B_TEMPLATE")] + [{ name: "E2B_TEMPLATE", value: $template }])
            | { family, taskRoleArn, executionRoleArn, networkMode, containerDefinitions, requiresCompatibilities, cpu, memory, runtimePlatform }
          ' current.json >next.json
          revision=$(aws ecs register-task-definition --cli-input-json file://next.json --query taskDefinition.taskDefinitionArn --output text)
          aws ecs update-service --cluster "$DEPLOY" --service server --task-definition "$revision" --query service.serviceName --output text

  app:
    name: app
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    environment: v2-prod
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build the app
        env:
          VITE_REN_API_URL: ${{ vars.REN_API_URL }}
          VITE_REN_VERSION: ${{ github.sha }}
        run: bun run --cwd packages/app build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      # Hashed files first and kept a year; then the index, never cached, so it never points at a
      # file that is not there yet.
      - name: Upload
        env:
          DEPLOY: ${{ vars.DEPLOY_NAME }}
          DISTRIBUTION: ${{ vars.APP_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          bucket="$DEPLOY-app-$(aws sts get-caller-identity --query Account --output text)"
          aws s3 sync packages/app/dist/assets/ "s3://$bucket/app/assets/" --cache-control "public, max-age=31536000, immutable" --only-show-errors
          aws s3 sync packages/app/dist/ "s3://$bucket/app/" --exclude "assets/*" --cache-control "no-cache" --delete --only-show-errors
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths "/app/*" --query Invalidation.Status --output text

  site:
    name: site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    environment: v2-prod
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build the site
        run: bun run --cwd packages/site build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      # The same order as the app. The site owns the bucket's root, the app owns /app/ and the CLI release
      # (cli-release.yml) owns /ren2/, so the delete leaves /app/ and /ren2/ alone.
      - name: Upload
        env:
          DEPLOY: ${{ vars.DEPLOY_NAME }}
          DISTRIBUTION: ${{ vars.APP_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          bucket="$DEPLOY-app-$(aws sts get-caller-identity --query Account --output text)"
          aws s3 sync packages/site/dist/_astro/ "s3://$bucket/_astro/" --cache-control "public, max-age=31536000, immutable" --only-show-errors
          aws s3 sync packages/site/dist/ "s3://$bucket/" --exclude "_astro/*" --exclude "app/*" --exclude "ren2/*" --cache-control "no-cache" --delete --only-show-errors
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths "/*" --query Invalidation.Status --output text

  egress:
    name: egress
    needs: [changes, server]
    if: needs.changes.outputs.egress == 'true'
    runs-on: ubuntu-latest
    environment: v2-prod
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build the egress
        working-directory: repos/iron-proxy
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: bun script/go.ts build -o bin/iron-proxy-linux-arm64 ./cmd/iron-proxy

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Release
        env:
          DEPLOY: ${{ vars.DEPLOY_NAME }}
          INSTANCE: ${{ vars.EGRESS_INSTANCE_ID }}
        run: |
          set -euo pipefail
          bucket="$DEPLOY-artifacts-$(aws sts get-caller-identity --query Account --output text)"
          aws s3 cp repos/iron-proxy/bin/iron-proxy-linux-arm64 "s3://$bucket/egress/$GITHUB_SHA/iron-proxy" --only-show-errors
          printf '%s' "$GITHUB_SHA" | aws s3 cp - "s3://$bucket/egress/current" --only-show-errors
          command=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name "$DEPLOY-egress-install" --query Command.CommandId --output text)
          echo "release command: $command"
