name: cli release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g. 0.1.0)
        required: true
        type: string

concurrency:
  group: cli-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'renai-labs/ren'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    environment: v2-prod
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TARGET: ${{ matrix.target }}
      REN2_HOST_URL: ${{ vars.REN2_HOST_URL || 'https://v2.useren.ai' }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Validate version
        shell: bash
        run: |
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Use a stable version: X.Y.Z' >&2; exit 1; }

      - name: Check CLI
        working-directory: packages/cli
        run: |
          bun run lint
          bun typecheck
          REN_SLOW=1 bun run test

      - name: Build
        working-directory: packages/cli
        env:
          REN2_API_URL: ${{ vars.REN_API_URL }}
        run: |
          test -n "$REN2_API_URL" || { echo 'Set REN_API_URL in the v2-prod environment' >&2; exit 1; }
          bun run build --version "$RELEASE_VERSION" --target "$RELEASE_TARGET"
          test "$("dist/releases/$RELEASE_VERSION/ren2-$RELEASE_TARGET" --version)" = "ren2 v$RELEASE_VERSION"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ren2-${{ matrix.target }}
          path: packages/cli/dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: v2-prod
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      DEPLOY: ${{ vars.DEPLOY_NAME }}
      DISTRIBUTION: ${{ vars.APP_DISTRIBUTION_ID }}
      REN2_HOST_URL: ${{ vars.REN2_HOST_URL || 'https://v2.useren.ai' }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ren2-*
          path: dist
          merge-multiple: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          bucket="$DEPLOY-app-$(aws sts get-caller-identity --query Account --output text)"
          prefix="ren2/releases/$RELEASE_VERSION/"
          count=$(aws s3api list-objects-v2 --bucket "$bucket" --prefix "$prefix" --query KeyCount --output text)
          test "$count" = 0 || { echo 'Release already exists' >&2; exit 1; }
          (cd "dist/releases/$RELEASE_VERSION" && sha256sum --check ./*.sha256)
          aws s3 sync "dist/releases/$RELEASE_VERSION/" "s3://$bucket/$prefix" --cache-control 'public, max-age=31536000, immutable' --only-show-errors
          aws s3 cp dist/install.sh "s3://$bucket/ren2/install.sh" --content-type text/x-shellscript --cache-control no-cache --only-show-errors
          if [ -f dist/oauth-client.json ]; then
            aws s3 cp dist/oauth-client.json "s3://$bucket/ren2/oauth-client.json" --content-type application/json --cache-control 'public, max-age=3600' --only-show-errors
          fi
          printf '%s\n' "$RELEASE_VERSION" | aws s3 cp - "s3://$bucket/ren2/latest.txt" --content-type text/plain --cache-control no-cache --only-show-errors
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths /ren2/install.sh /ren2/latest.txt /ren2/oauth-client.json --query Invalidation.Status --output text
          printf 'Install: curl -fsSL %s/ren2/install.sh | bash\n' "$REN2_HOST_URL"
