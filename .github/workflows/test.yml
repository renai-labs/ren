name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgres://ren:ren@localhost:54320/ren
  REN_SLOW: "1"
  TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('{0}^1', github.sha) || github.event.before }}
  TURBO_SCM_HEAD: ${{ github.sha }}

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ren
          POSTGRES_PASSWORD: ren
          POSTGRES_DB: ren
        ports:
          - 54320:5432
        options: >-
          --health-cmd "pg_isready -U ren"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-
            turbo-${{ runner.os }}-

      - name: Run unit tests
        timeout-minutes: 20
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            bun turbo test --concurrency=3 --filter='!@ren/e2e' --filter='!@ren/storybook'
            exit 0
          fi
          bun turbo test --affected --concurrency=3 --filter='!@ren/e2e' --filter='!@ren/storybook'

      - name: Check generated auth schema
        working-directory: packages/server
        run: bun run check:generated

      - name: Check cell portability
        timeout-minutes: 10
        working-directory: packages/cell
        run: bun run test:cloudflare

      - name: Check BrainHost portability
        timeout-minutes: 5
        working-directory: packages/core
        run: bun run test:cloudflare

      - name: Check generated OpenAPI
        working-directory: packages/protocol
        run: bun run check:generated

      - name: Check generated client
        working-directory: packages/client
        run: bun run check:generated

      - name: Check generated routes
        working-directory: packages/app
        run: bun run check:generated

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ren
          POSTGRES_PASSWORD: ren
          POSTGRES_DB: ren
        ports:
          - 54320:5432
        options: >-
          --health-cmd "pg_isready -U ren"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright Chromium
        working-directory: packages/e2e
        run: bunx playwright install --with-deps chromium

      - name: Run end-to-end tests
        timeout-minutes: 15
        working-directory: packages/e2e
        run: bun run test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-${{ github.run_attempt }}
          path: |
            packages/e2e/playwright-report
            packages/e2e/test-results
          retention-days: 7

  storybook:
    name: storybook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright Chromium
        working-directory: packages/storybook
        run: bunx playwright install --with-deps chromium

      - name: Build Storybook
        working-directory: packages/storybook
        run: bun run build

      - name: Run story specs
        timeout-minutes: 10
        working-directory: packages/storybook
        run: bun run test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: storybook-playwright-${{ github.run_attempt }}
          path: |
            packages/storybook/playwright-report
            packages/storybook/test-results
          retention-days: 7
